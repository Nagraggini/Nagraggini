name: Generate Pacman Garph

on:
    # Minden 12 órában automatikusan lefut
    schedule:
        - cron: "0 */12 * * *"

    # Manuálisan is elindítható bármikor
    workflow_dispatch:

    # Lefut akkor is, ha változtatsz a main ágon
    push:
        branches:
            - main

jobs:
    generate:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            # Generálja a Pac-Man játékot a GitHub hozzájárulásokból
            - name: generate github-contribution-grid-snake.svg
              uses: Platane/snk@v3
              with:
                  github_user_name: ${{ github.repository_owner }}
                  outputs: |
                      dist/github-contribution-grid-snake.svg
                      dist/github-contribution-grid-snake-dark.svg?palette=github-dark

            # Feltölti a legenerált SVG fájlt a 'output' nevű ágra (branch-re)
            - name: push github-contribution-grid-snake.svg to the output branch
              uses: crazy-max/ghaction-github-pages@v3.1.0
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
# A GitHub Actions részen -> A bal oldali listában kattints a Generate Pacman Garph nevű actionre.
# Katt a Run workflow gombra.
# Várj kb 2 percet a háttérben létrejön az output ág.
