name: Generate Pacman Graph

on:
    schedule:
        - cron: "0 */12 * * *"

    workflow_dispatch:

    push:
        branches:
            - main

permissions:
    contents: write

jobs:
    generate:
        runs-on: ubuntu-latest

        steps:
            - name: Generate Pacman contribution graph
              uses: abozanona/pacman-contribution-graph@main
              with:
                  github_user_name: ${{ github.repository_owner }}

            - name: Push generated files to output branch
              uses: crazy-max/ghaction-github-pages@v3.1.0
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
# A GitHub Actions részen -> A bal oldali listában kattints a Generate Pacman Garph nevű actionre.
# Katt a Run workflow gombra.
# Várj kb 2 percet a háttérben létrejön az output ág.
